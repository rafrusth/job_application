<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PathFinder — Setting Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #F7F0E6;
      --ink:        #333030;
      --ink-mute:   #A09890;
      --field-bg:   #E0D8CC;
      --field-dark: #C8C0B4;
      --btn-bg:     #2E2C2A;
      --btn-text:   #F7F0E6;
      --step-off:   #C8BFB5;
      --radius:     14px;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Fraunces', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    nav {
      padding: 28px 52px;
      opacity: 0;
      animation: fadeDown .45s .05s ease forwards;
    }

    .logo {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -.02em;
      color: var(--ink);
      text-decoration: none;
    }

    /* ── Layout ── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: start;
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
      padding: 52px 52px 100px;
      gap: 80px;
    }

    /* ── Left panel ── */
    .left {
      opacity: 0;
      animation: fadeUp .5s .15s ease forwards;
    }

    .left h1 {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: clamp(2rem, 3.5vw, 2.8rem);
      letter-spacing: -.03em;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .left .subtitle {
      font-size: 1rem;
      font-weight: 300;
      color: var(--ink-mute);
      margin-bottom: 52px;
    }

    /* Steps */
    .steps { display: flex; flex-direction: column; gap: 0; }

    .step {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 16px 0;
      cursor: pointer;
      position: relative;
    }

    /* connector line between steps */
    .step:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 19px;
      top: 52px;
      width: 2px;
      height: calc(100% - 20px);
      background: var(--step-off);
      border-radius: 2px;
      transition: background .3s;
    }

    .step.active:not(:last-child)::after { background: var(--ink); }

    .step-num {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--step-off);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .9rem;
      font-weight: 500;
      flex-shrink: 0;
      transition: background .3s, transform .2s;
    }

    .step.active .step-num {
      background: var(--btn-bg);
      transform: scale(1.05);
    }

    .step.done .step-num {
      background: var(--btn-bg);
    }

    .step-label {
      font-size: 1.05rem;
      font-weight: 400;
      color: var(--step-off);
      transition: color .3s, font-weight .2s;
    }

    .step.active .step-label {
      color: var(--ink);
      font-weight: 700;
    }

    .step.done .step-label { color: var(--ink-mute); }

    /* ── Right panel ── */
    .right {
      padding-top: 4px;
      opacity: 0;
      animation: fadeUp .5s .25s ease forwards;
    }

    /* Step panels */
    .step-panel { display: none; flex-direction: column; gap: 0; }
    .step-panel.active { display: flex; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 26px;
      animation: fadeUp .4s ease forwards;
    }

    label {
      font-size: .75rem;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink-mute);
    }

    input, select {
      background: var(--field-bg);
      border: none;
      border-radius: var(--radius);
      padding: 18px 22px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      color: var(--ink);
      outline: none;
      width: 100%;
      transition: background .2s, box-shadow .2s;
      appearance: none;
      -webkit-appearance: none;
    }

    input::placeholder { color: var(--ink-mute); }

    input:focus, select:focus {
      background: var(--field-dark);
      box-shadow: 0 0 0 3px rgba(50,48,45,.12);
    }

    /* Custom select wrapper */
    .select-wrap { position: relative; }

    .select-wrap::after {
      content: '↓';
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink-mute);
      pointer-events: none;
      font-size: .9rem;
    }

    select { cursor: pointer; padding-right: 44px; }

    /* Phone row */
    .phone-row { display: flex; gap: 10px; }

    .phone-code {
      width: 90px;
      flex-shrink: 0;
      text-align: center;
    }

    /* Password strength */
    .strength-bar {
      display: flex;
      gap: 5px;
      margin-top: 6px;
    }

    .strength-seg {
      height: 3px;
      flex: 1;
      background: var(--step-off);
      border-radius: 2px;
      transition: background .3s;
    }

    .strength-seg.fill-weak   { background: #c0704a; }
    .strength-seg.fill-medium { background: #c9a44a; }
    .strength-seg.fill-strong { background: #5a9e6f; }

    .strength-hint {
      font-size: .72rem;
      color: var(--ink-mute);
      margin-top: 4px;
    }

    /* ── Button ── */
    .btn-wrap { margin-top: 12px; }

    .btn-next {
      width: 100%;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: var(--radius);
      padding: 20px 24px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: .02em;
      cursor: pointer;
      transition: background .2s, transform .15s;
    }

    .btn-next:hover { background: #1a1917; transform: translateY(-1px); }
    .btn-next:active { transform: translateY(0); }

    /* ── Animations ── */
    @keyframes fadeUp   { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeDown { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }

    /* ── Responsive ── */
    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; padding: 36px 24px 80px; gap: 44px; }
      nav  { padding: 22px 24px; }
    }
  </style>
</head>
<body>

  <nav><a class="logo" href="pathfinder-landing.html">PathFinder</a></nav>

  <main>
    <!-- Left: heading + step list -->
    <section class="left">
      <h1>Setting up</h1>
      <p class="subtitle">Tell us more about yourself and your goal.</p>

      <div class="steps">
        <div class="step active" data-step="1" onclick="goTo(1)">
          <div class="step-num">1</div>
          <span class="step-label">Set Your Password</span>
        </div>
        <div class="step" data-step="2" onclick="goTo(2)">
          <div class="step-num">2</div>
          <span class="step-label">Personal Information</span>
        </div>
        <div class="step" data-step="3" onclick="goTo(3)">
          <div class="step-num">3</div>
          <span class="step-label">Job Target and Goals</span>
        </div>
      </div>
    </section>

    <!-- Right: form panels -->
    <section class="right">

      <!-- Step 1: Password -->
      <div class="step-panel active" id="panel-1">
        <div class="field">
          <label for="pwd">Password</label>
          <input id="pwd" type="password" placeholder="Create a password" oninput="checkStrength(this.value)" autocomplete="new-password" />
          <div class="strength-bar">
            <div class="strength-seg" id="s1"></div>
            <div class="strength-seg" id="s2"></div>
            <div class="strength-seg" id="s3"></div>
            <div class="strength-seg" id="s4"></div>
          </div>
          <span class="strength-hint" id="strength-hint">Use 8+ characters, numbers &amp; symbols</span>
        </div>
        <div class="field">
          <label for="pwd2">Confirm Password</label>
          <input id="pwd2" type="password" placeholder="Repeat your password" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="jane@example.com" autocomplete="email" />
        </div>
        <div class="btn-wrap">
          <button class="btn-next" onclick="next(1)">Continue →</button>
        </div>
      </div>

      <!-- Step 2: Personal Info -->
      <div class="step-panel" id="panel-2">
        <div class="field">
          <label for="fname">First Name</label>
          <input id="fname" type="text" placeholder="Jane" autocomplete="given-name" />
        </div>
        <div class="field">
          <label for="lname">Last Name</label>
          <input id="lname" type="text" placeholder="Doe" autocomplete="family-name" />
        </div>
        <div class="field">
          <label>Phone Number</label>
          <div class="phone-row">
            <input class="phone-code" type="text" value="+1" placeholder="+1" />
            <input type="tel" placeholder="(555) 000-0000" autocomplete="tel" style="flex:1;" />
          </div>
        </div>
        <div class="btn-wrap">
          <button class="btn-next" onclick="next(2)">Continue →</button>
        </div>
      </div>

      <!-- Step 3: Goals -->
      <div class="step-panel" id="panel-3">
        <div class="field">
          <label for="role">Current Role / Title</label>
          <input id="role" type="text" placeholder="e.g. Junior Developer" />
        </div>
        <div class="field">
          <label for="exp">Years of Experience</label>
          <input id="exp" type="number" min="0" max="40" placeholder="0" />
        </div>
        <div class="field">
          <label for="goal">Job Target</label>
          <div class="select-wrap">
            <select id="goal">
              <option value="" disabled selected>Select a goal…</option>
              <option value="backend">Backend</option>
              <option value="frontend">Frontend</option>
              <option value="fullstack">Full Stack</option>
              <option value="aiml">AI / ML</option>
            </select>
          </div>
        </div>
        <div class="btn-wrap">
          <button class="btn-next" onclick="finish()">Finish Setup ✓</button>
        </div>
      </div>

    </section>
  </main>

  <script>
    let current = 1;
    const total = 3;

    function goTo(n) {
      // only allow jumping to completed or current steps
      if (n > current) return;
      switchTo(n);
    }

    function next(from) {
      if (from < total) switchTo(from + 1);
    }

    function switchTo(n) {
      // deactivate old
      document.querySelectorAll('.step').forEach(s => {
        const sn = parseInt(s.dataset.step);
        s.classList.remove('active', 'done');
        if (sn < n) s.classList.add('done');
        if (sn === n) s.classList.add('active');
      });

      document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + n).classList.add('active');
      current = n;
    }

    // Password strength
    function checkStrength(val) {
      const segs = [document.getElementById('s1'), document.getElementById('s2'),
                    document.getElementById('s3'), document.getElementById('s4')];
      const hint = document.getElementById('strength-hint');

      segs.forEach(s => s.className = 'strength-seg');

      let score = 0;
      if (val.length >= 8)              score++;
      if (/[A-Z]/.test(val))            score++;
      if (/[0-9]/.test(val))            score++;
      if (/[^A-Za-z0-9]/.test(val))     score++;

      const cls = score <= 1 ? 'fill-weak' : score <= 2 ? 'fill-medium' : 'fill-strong';
      const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
      const hints  = ['Use 8+ characters, numbers & symbols',
                      'Add uppercase letters or numbers',
                      'Add a symbol for a stronger password',
                      'Good — add a symbol to make it strong',
                      'Strong password!'];

      for (let i = 0; i < score; i++) segs[i].classList.add(cls);
      hint.textContent = hints[score];
    }

    function finish() {
      document.querySelectorAll('.step').forEach(s => s.classList.add('done'));
      document.querySelector('.step[data-step="3"]').classList.add('active');
      alert('🎉 Setup complete! Welcome to PathFinder.');
    }
  </script>
</body>
</html>
